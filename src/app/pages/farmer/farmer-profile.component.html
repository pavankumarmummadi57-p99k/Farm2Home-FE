<section class="page-narrow">
  <div class="page-heading"><div><h1>Farmer profile</h1><p>Review and update your registered farm information.</p></div></div>

  @if (loading()) {
    <div class="loading"><div><div class="spinner"></div>Loading profile…</div></div>
  } @else {
    <form class="card form-card" [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="field"><label>Farmer name</label><input formControlName="farmerName"></div>
        <div class="field"><label>Farm name</label><input formControlName="farmName"></div>
        <div class="field full"><label>Farm address</label><textarea formControlName="farmAddress"></textarea></div>
        <div class="field"><label>Village</label><input formControlName="village"></div>
        <div class="field"><label>Mandal</label><input formControlName="mandal"></div>
        <div class="field"><label>District</label><input formControlName="district"></div>
        <div class="field"><label>State</label><input formControlName="state"></div>
        <div class="field"><label>Pincode</label><input formControlName="pincode" maxlength="6"></div>
        <div class="field"><label>Farm area</label><input formControlName="farmArea" type="number" min="0.01" step="0.01"></div>
        <div class="field">
          <label>Government ID type</label>
          <select formControlName="governmentIdType">
            <option value="AADHAAR">Aadhaar</option><option value="VOTER_ID">Voter ID</option>
            <option value="DRIVING_LICENSE">Driving licence</option><option value="PAN">PAN</option>
          </select>
        </div>
        <div class="field"><label>Government ID number</label><input formControlName="governmentIdNumber"></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" type="submit" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save profile' }}</button></div>
    </form>
  }
</section>
